<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <script src="https://kit.fontawesome.com/5184b8e279.js" crossorigin="anonymous"></script>
    <script src="./js/time.js" defer></script>
    <script src="./js/weather.js" defer></script>
    <link rel="icon" href="./images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans&family=Orbitron&family=Righteous&family=Saira&family=Shrikhand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style/main.css">
</head>
<body>
    <header>
        <button class="burger" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="container header-wrap collapse" id="navbarNav">
            <div class="city-group">
                <input type="text" id="city-input" placeholder="Search City" aria-label="City" aria-describedby="button-addon2"><button type="button" id="search"><i class="fa-solid fa-magnifying-glass"></i></button>
                <img src="./images/mapPing.png" alt="map ping">
            </div>

            <div class="registry-buttons">
                <button class="sign" type="button" id="sign"><a href="./sign-in.html">Sign in</a></button>
                <button class="log" type="button" id="log"><a href="./log-in.html">Log in</a></button>
            </div>
        </div>
    </header>
    <main>
        <p class="weather-msg" id="weather-message" role="status"></p>
        <div class="container">

            <div class="row">

                <div class="city-card" id="weather-card">
                    <div class="container">
                        <div class="row">
                            <div class="col weather">
                                <img id="weather-icon">
                                <span id="temperature"></span>
                            </div>
                        </div>
                        <div class="row">
                            <span id="weather-description"></span>
                        </div>
                    </div>
                    <span class="city" id="city-name">Search City</span>
                </div>

                <div class="city-card fixed-weather-card" data-city="Alicante">
                    <div class="container">
                        <div class="row">
                            <div class="col weather">
                                <img class="weather-icon">
                                <span class="temperature"></span>
                            </div>
                        </div>
                        <div class="row">
                            <span class="weather-description"></span>
                        </div>
                    </div>
                    <span class="city city-name"></span>
                </div>

                <div class="city-card fixed-weather-card" data-city="Paris">
                    <div class="container">
                        <div class="row">
                            <div class="col weather">
                                <img class="weather-icon">
                                <span class="temperature"></span>
                            </div>
                        </div>
                        <div class="row">
                            <span class="weather-description"></span>
                        </div>
                    </div>
                    <span class="city city-name"></span>
                </div>

            </div>

            <div class="row">
                
                <div class="city-card fixed-weather-card" data-city="Netherlands">                    
                    <div class="container">
                        <div class="row">
                            <div class="col weather">
                                <img class="weather-icon">
                                <span class="temperature"></span>
                            </div>
                        </div>
                        <div class="row">
                            <span class="weather-description"></span>
                        </div>
                    </div>
                    <span class="city city-name"></span>
                </div>

                <div class="city-card fixed-weather-card" data-city="Warsaw">
                    <div class="container">
                        <div class="row">
                            <div class="col weather">
                                <img class="weather-icon">
                                <span class="temperature"></span>
                            </div>
                        </div>
                        <div class="row">
                            <span class="weather-description"></span>
                        </div>
                    </div>
                    <span class="city city-name"></span>
                </div>

                <div class="city-card fixed-weather-card" data-city="Lviv">
                    <div class="container">
                        <div class="row">
                            <div class="col weather">
                                <img class="weather-icon">
                                <span class="temperature"></span>
                            </div>
                        </div>
                        <div class="row">
                            <span class="weather-description"></span>
                        </div>
                    </div>
                    <span class="city city-name"></span>
                </div>
            </div>
        </div>

    </main>

    <footer>
        <div class="container d-flex justify-content-center">
            <div class="time shadow d-flex">
                <img src="./images/sun.png" alt="sun">
                <span id="hours"></span>
                <span>:</span>
                <span id="minutes"></span>
                <span>:</span>
                <span id="seconds"></span>
            </div>
        </div>
            
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js" integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+" crossorigin="anonymous"></script>
</body>
</html>
