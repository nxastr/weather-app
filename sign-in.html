<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App - Sign In</title>
    <script src="https://kit.fontawesome.com/5184b8e279.js" crossorigin="anonymous"></script>
    <link rel="icon" href="./images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans&family=Orbitron&family=Righteous&family=Saira&family=Shrikhand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style/log.css">
</head>
<body>
    <main>
        <div class="container d-flex flex-column">
                <input type="text" class="form-control mt-2" id="inputName" placeholder="name">
                <hr>
                <input type="email" class="form-control mt-4" id="inputEmail" placeholder="email">
                <hr>
                <input type="password" class="form-control mt-4" id="inputPassword" placeholder="password">
                <hr>
                <button class="mt-4" type="button" id="log">Sign in</button>
                <span class="text mt-5">Already have an account?<a href="log-in.html"> Log in</a></span>

        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js" integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+" crossorigin="anonymous"></script>
</body>
</html>
